name: CI

# Runs lint / typecheck / tests on every PR. Detects the project's stack
# automatically and exits non-zero on real failures (no '|| true' suppression).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  js:
    name: JS / TS checks
    runs-on: ubuntu-latest
    if: hashFiles('package.json') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "name=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "name=yarn" >> "$GITHUB_OUTPUT"
          else
            echo "name=npm" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: ${{ steps.pm.outputs.name }}

      - name: Install
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) corepack enable && pnpm install --frozen-lockfile ;;
            yarn) corepack enable && yarn install --frozen-lockfile ;;
            npm)  npm ci ;;
          esac

      - name: Lint
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm run --if-present lint ;;
            yarn) yarn run --silent lint || true ;;
            npm)  npm run --if-present lint ;;
          esac

      - name: Typecheck
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm run --if-present typecheck ;;
            yarn) yarn run --silent typecheck || true ;;
            npm)  npm run --if-present typecheck ;;
          esac

      - name: Test
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm run --if-present test ;;
            yarn) yarn run --silent test ;;
            npm)  npm test --if-present ;;
          esac

      - name: Build
        run: |
          case "${{ steps.pm.outputs.name }}" in
            pnpm) pnpm run --if-present build ;;
            yarn) yarn run --silent build || true ;;
            npm)  npm run --if-present build ;;
          esac

  python:
    name: Python checks
    runs-on: ubuntu-latest
    if: hashFiles('pyproject.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install -U pip
          # Try dev extras first, fall back to plain install.
          pip install -e ".[dev]" || pip install -e .

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: |
          if command -v mypy >/dev/null 2>&1; then mypy .; else echo "mypy not installed, skipping"; fi

      - name: Pytest
        run: pytest

  go:
    name: Go checks
    runs-on: ubuntu-latest
    if: hashFiles('go.mod') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    if: hashFiles('Cargo.toml') != ''
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
